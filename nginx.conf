server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;

    # 브랜드에 맞는 404 페이지
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 숨김 파일은 어떤 경우에도 내보내지 않습니다. .DS_Store 는 폴더 안 파일명을
    # 담고 있어 실수로 남으면 디렉터리 구조가 노출됩니다(.dockerignore 로도 막지만
    # 패턴을 놓치면 그대로 서빙되므로 서버에서 한 번 더 끊습니다).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # HTML은 항상 서버에 재검증 — 내용을 고치면 바로 반영됩니다.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # CSS/JS도 재검증(ETag)으로 처리합니다. 파일명에 해시를 붙이지 않는
    # 구조라 long-cache를 걸면 수정이 며칠씩 반영되지 않습니다.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # 이미지·PDF·폰트는 자주 바뀌지 않으므로 길게 캐시합니다.
    location ~* \.(jpg|jpeg|png|gif|svg|webp|ico|pdf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
